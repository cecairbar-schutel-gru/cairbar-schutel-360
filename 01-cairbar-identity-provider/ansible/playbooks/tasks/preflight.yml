---
- name: Validar sistema operacional suportado
  ansible.builtin.assert:
    that:
      - ansible_facts['distribution'] == 'Ubuntu'
      - ansible_facts['distribution_major_version'] is version('22', '>=')
    fail_msg: "Playbooks escritos para Ubuntu 22.04+ (encontrado: {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }})"
    quiet: true

- name: Validar segredos obrigatórios
  ansible.builtin.assert:
    that: lookup('ansible.builtin.vars', item, default='') | length > 0
    fail_msg: "{{ item }} não definido: crie global_vars/secrets-{{ ambiente }}.yml a partir de secrets.yml.example"
    quiet: true
  loop: "{{ required_secrets | default([]) }}"
