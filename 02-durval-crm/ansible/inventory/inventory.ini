[webapps]
# Domínios de cada ambiente: os mesmos do inventário da solução 01 (dominio_publico = realm
# cecairbar, dominio_admin = realm master, dominio_durvalcrm = site do DurvalCRM).
vm-exp-cairbar-360 ansible_host=203.0.113.10 dominio_publico=comunidade-cairbar.203-0-113-10.nip.io dominio_admin=keycloak.203-0-113-10.nip.io dominio_durvalcrm=durvalcrm.203-0-113-10.nip.io
cairbar-360-qas ansible_host=203.0.113.20 dominio_publico=comunidade-cairbar.203-0-113-20.nip.io dominio_admin=keycloak.203-0-113-20.nip.io dominio_durvalcrm=durvalcrm.203-0-113-20.nip.io

# PostgreSQL e Tomcat ficam em cada VM (vm-exp-cairbar-360, cairbar-360-qas). O Keycloak é externo
# (keycloak-cecairbar.yml roda no controlador, com os domínios de cada host de webapps).
[postgresql]
vm-exp-cairbar-360
cairbar-360-qas

[tomcat]
vm-exp-cairbar-360
cairbar-360-qas

# nginx instalado por 01-cairbar-identity-provider; aqui só o site do DurvalCRM.
[nginx]
vm-exp-cairbar-360
cairbar-360-qas

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file={{ inventory_dir }}/ssh_keys/vm-exp-cairbar-360-key.pem
ansible_python_interpreter=/usr/bin/python3
# O execution environment é efêmero (sem known_hosts persistente) e o
# ~/.ssh/config do macOS (UseKeychain) é inválido no Linux do container.
ansible_ssh_common_args=-F /dev/null -o StrictHostKeyChecking=accept-new
