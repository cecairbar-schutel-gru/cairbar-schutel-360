---
# Publica o DurvalCRM em https://<durvalcrm_hostname> no nginx da VM. O nginx é instalado
# por 01-cairbar-identity-provider (playbooks/keycloak.yml), que precisa rodar antes:
# aqui só entra o site do DurvalCRM (sites-available/durvalcrm.conf) e o certificado dele.
- name: Publicar DurvalCRM no nginx
  hosts: nginx
  become: true
  vars_files:
    - ../global_vars/main.yml
  vars:
    nginx_site: durvalcrm
    nginx_site_hostname: "{{ durvalcrm_hostname }}"
    nginx_site_tls_mode: "{{ durvalcrm_tls_mode }}"
    nginx_site_letsencrypt_email: "{{ durvalcrm_letsencrypt_email }}"

  pre_tasks:
    - name: Verificações iniciais
      ansible.builtin.import_tasks: tasks/preflight.yml

  tasks:
    - name: Configurar site e TLS
      ansible.builtin.import_tasks: tasks/nginx-site.yml

    # 502/504 indicam o Tomcat fora do ar (rode tomcat.yml e implante o WAR).
    - name: Verificar publicação do DurvalCRM pelo proxy
      ansible.builtin.uri:
        url: "https://127.0.0.1/"
        headers:
          Host: "{{ durvalcrm_hostname }}"
        validate_certs: false
        follow_redirects: none
        status_code: [200, 301, 302, 401, 403, 404]
      changed_when: false

  handlers:
    - name: Recarregar nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
