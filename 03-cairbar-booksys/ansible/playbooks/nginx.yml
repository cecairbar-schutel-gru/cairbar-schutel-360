---
# Publica o Sistema de Biblioteca (SGB) em https://<sgb_hostname> no nginx da VM. O nginx é instalado
# por 01-cairbar-identity-provider (playbooks/keycloak.yml), que precisa rodar antes:
# aqui só entra o site do SGB (sites-available/sgb.conf) e o certificado dele.
- name: Publicar Sistema de Biblioteca (SGB) no nginx
  hosts: nginx
  become: true
  vars_files:
    - ../global_vars/main.yml
  vars:
    nginx_site: sgb
    nginx_site_hostname: "{{ sgb_hostname }}"
    nginx_site_tls_mode: "{{ sgb_tls_mode }}"
    nginx_site_letsencrypt_email: "{{ sgb_letsencrypt_email }}"

  pre_tasks:
    - name: Verificações iniciais
      ansible.builtin.import_tasks: tasks/preflight.yml

  tasks:
    - name: Configurar site e TLS
      ansible.builtin.import_tasks: tasks/nginx-site.yml

    # 502/504 indicam o Tomcat fora do ar (rode tomcat.yml).
    - name: Verificar publicação do SGB pelo proxy
      ansible.builtin.uri:
        url: "https://127.0.0.1/"
        headers:
          Host: "{{ sgb_hostname }}"
        validate_certs: false
        follow_redirects: none
        status_code: [200, 301, 302, 401, 403, 404]
      changed_when: false

  handlers:
    - name: Recarregar nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
