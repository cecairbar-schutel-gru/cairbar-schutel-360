[webapps]
vm-exp-cairbar-360 ansible_host=20.55.96.192

# PostgreSQL e Keycloak são instalados pela solução 01-cairbar-identity-provider;
# o grupo postgresql indica onde criar o banco do Booksys.
[postgresql]
vm-exp-cairbar-360

[tomcat]
vm-exp-cairbar-360

# nginx instalado por 01-cairbar-identity-provider; aqui só o site do SGB.
[nginx]
vm-exp-cairbar-360

[all:vars]
ansible_user=azureuser
ansible_ssh_private_key_file={{ inventory_dir }}/ssh_keys/vm-exp-cairbar-360-key.pem
ansible_python_interpreter=/usr/bin/python3
# O execution environment é efêmero (sem known_hosts persistente) e o
# ~/.ssh/config do macOS (UseKeychain) é inválido no Linux do container.
ansible_ssh_common_args=-F /dev/null -o StrictHostKeyChecking=accept-new
